[package]
name = "envdiff"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
anyhow = "1"
thiserror = "1"
colored = "2"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"