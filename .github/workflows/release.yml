name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: envdiff-linux-x86_64

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: envdiff-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: envdiff-macos-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: envdiff-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Inject Pro licence
        env:
          LICENCE_CONTENT: ${{ secrets.LICENCE_RS }}
        shell: bash
        run: |
          if [ -n "$LICENCE_CONTENT" ]; then
            printf '%s' "$LICENCE_CONTENT" > src/licence.rs
            echo "Building Pro binary"
          else
            echo "LICENCE_RS secret not set — building community binary"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/envdiff ${{ matrix.artifact }}

      - name: Package artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: cp target/${{ matrix.target }}/release/envdiff.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
